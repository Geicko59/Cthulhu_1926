<style>
  :root{
    --bg-void:#0a0b09;
    --bg-panel:#15140f;
    --bg-panel-alt:#1c1a14;
    --border-relic:#3c3627;
    --ink-bone:#ddd2ba;
    --ink-muted:#8d8570;
    --accent-abyss:#3f5049;
    --accent-abyss-light:#61756a;
    --accent-gold:#a4914f;
    --red-vif:#ff2020;
    --red-glow:rgba(255,32,32,.55);
    --green-fluo:#39ff14;
    --green-fluo-glow:rgba(57,255,20,.6);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:radial-gradient(ellipse at top, #14150f 0%, #080907 72%);
    color:var(--ink-bone);
    font-family:'EB Garamond', serif;
    -webkit-font-smoothing:antialiased;
  }

  /* -- En-tête général -- */
  .masthead{ text-align:center; padding:2.4rem 1rem 1.2rem; }
  .masthead h1{
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:clamp(1.5rem, 4vw, 2.3rem);
    letter-spacing:.08em;
    margin:0;
    color:var(--ink-bone);
  }
  .masthead h1 span{ color:var(--accent-gold); }
  .masthead-sub{
    font-style:italic;
    color:var(--ink-muted);
    font-size:.95rem;
    margin:.4rem 0 0;
  }

  /* -- Barre de date sélectionnée -- */
  .selected-date-bar{
    position:sticky;
    top:0;
    z-index:10;
    text-align:center;
    padding:.6rem 1rem;
    margin:0 auto 1.2rem;
    max-width:640px;
    font-family:'Cinzel', serif;
    font-size:clamp(.85rem, 2.2vw, 1.05rem);
    letter-spacing:.04em;
    color:var(--accent-gold);
    background:rgba(10,11,9,.9);
    backdrop-filter:blur(3px);
    border:1px solid var(--border-relic);
    border-radius:3px;
  }
  .selected-date-bar.empty{ color:var(--ink-muted); font-family:'EB Garamond', serif; font-style:italic; letter-spacing:0; }

    background-position:center;
    border-bottom:1px solid var(--border-relic);
  }

  /* -- Barre joueur (compacte) -- */
  .player-bar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:.35rem;
    max-width:420px;
    margin:0 auto .9rem;
    padding:.35rem .5rem;
    border:1px solid var(--border-relic);
    border-radius:4px;
    background:var(--bg-panel);
    font-size:.72rem;
    color:var(--ink-muted);
  }
  .player-bar label{ display:flex; align-items:center; gap:.3rem; }
  .player-bar select{
    background:var(--bg-panel-alt);
    color:var(--ink-bone);
    border:1px solid var(--border-relic);
    border-radius:3px;
    padding:.15rem .3rem;
    font-family:'EB Garamond', serif;
    font-size:.75rem;
    max-width:6.5rem;
  }
  .player-bar select:focus-visible{ outline:2px solid var(--accent-gold); outline-offset:2px; }
  .mini-btn{
    background:transparent;
    border:1px solid var(--border-relic);
    color:var(--ink-muted);
    border-radius:3px;
    padding:.18rem .45rem;
    font-family:'EB Garamond', serif;
    font-size:.7rem;
    cursor:pointer;
    transition:color .2s, border-color .2s;
  }
  .mini-btn:hover{ color:var(--ink-bone); border-color:var(--accent-gold); }
  .mini-btn:focus-visible{ outline:2px solid var(--accent-gold); outline-offset:2px; }
  .mini-btn--danger{ opacity:.7; }
  .mini-btn--danger:hover{ color:var(--red-vif); border-color:var(--red-vif); opacity:1; }
  .save-status{ font-size:.68rem; color:var(--accent-gold); min-width:5rem; }

  /* -- Navigation mensuelle -- */
  .month-nav{
    display:flex;
    gap:.4rem;
    overflow-x:auto;
    padding:0 1rem 1.4rem;
    max-width:1100px;
    margin:0 auto;
  }
  .month-nav::-webkit-scrollbar{ height:6px; }
  .month-nav::-webkit-scrollbar-thumb{ background:var(--border-relic); border-radius:4px; }
  .tab-btn{
    flex:0 0 auto;
    font-family:'EB Garamond', serif;
    font-size:.85rem;
    letter-spacing:.03em;
    color:var(--ink-muted);
    background:var(--bg-panel);
    border:1px solid var(--border-relic);
    padding:.5rem 1.1rem;
    border-radius:3px;
    cursor:pointer;
    transition:color .2s, border-color .2s, background .2s;
  }
  .tab-btn:hover{ color:var(--ink-bone); border-color:var(--accent-gold); }
  .tab-btn.active{ color:var(--bg-void); background:var(--accent-gold); border-color:var(--accent-gold); font-weight:600; }
  .tab-btn:focus-visible{ outline:2px solid var(--accent-gold); outline-offset:2px; }

  main{ max-width:1100px; margin:0 auto; padding:0 1rem 3rem; }
  .loading-note{ text-align:center; color:var(--ink-muted); font-style:italic; padding:2rem 0; }

  /* -- Panneau mensuel -- */
  .month-panel{ display:none; }
  .month-panel.active{ display:block; animation:fadein .35s ease; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }

  /* -- Couloirs gauche / droite -- */
  .month-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    flex-wrap:wrap;
    margin-bottom:1.7rem;
  }

  .cthulhu-corner{ position:relative; width:clamp(96px,16vw,140px); height:clamp(96px,16vw,140px); flex:0 0 auto; }
  .cthulhu-icon-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .cthulhu-icon{ width:44%; height:44%; color:var(--accent-abyss-light); transition:color .3s; }
  .cthulhu-icon.awakened{ color:var(--red-vif); animation:cthulhu-pulse 1.1s ease-in-out infinite; }
  @keyframes cthulhu-pulse{
    0%,100%{ filter:drop-shadow(0 0 2px transparent); opacity:.8; }
    50%{ filter:drop-shadow(0 0 12px var(--red-glow)); opacity:1; }
  }
  @media (prefers-reduced-motion:reduce){
    .cthulhu-icon.awakened{ animation:none; filter:drop-shadow(0 0 10px var(--red-glow)); }
  }

  .bubble{
    position:absolute;
    width:16px; height:16px;
    border-radius:50%;
    border:1.5px solid var(--border-relic);
    background:transparent;
    transform:translate(-50%,-50%);
    cursor:pointer;
    padding:0;
    transition:background .2s, border-color .2s, box-shadow .2s;
  }
  .bubble:hover{ border-color:var(--accent-gold); }
  .bubble.lit{ background:var(--red-vif); border-color:var(--red-vif); box-shadow:0 0 8px var(--red-glow); }
  .bubble:focus-visible{ outline:2px solid var(--accent-gold); outline-offset:2px; }

  .month-title{
    flex:1 1 auto;
    text-align:center;
    font-family:'Cinzel', serif;
    font-weight:600;
    letter-spacing:.06em;
    font-size:clamp(1.25rem, 3vw, 1.85rem);
    margin:0;
    color:var(--ink-bone);
  }
  .month-title .year{ display:block; font-size:.55em; letter-spacing:.25em; color:var(--accent-gold); margin-top:.2rem; }

  .star-corner{ display:flex; flex-direction:column; align-items:center; gap:.5rem; width:clamp(96px,16vw,140px); flex:0 0 auto; }
  .star-icon{ width:32px; height:32px; color:var(--accent-gold); filter:drop-shadow(0 0 4px rgba(164,145,79,.4)); }
  .score-field{ display:flex; align-items:baseline; gap:.4rem; font-size:.78rem; color:var(--ink-muted); letter-spacing:.03em; }
  .score-input{
    width:3.4rem;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--border-relic);
    color:var(--ink-bone);
    font-family:'EB Garamond', serif;
    font-size:1rem;
    text-align:center;
    padding:.1rem 0;
  }
  .score-input:focus{ outline:none; border-color:var(--accent-gold); }
  .score-input[readonly]{ cursor:default; }

  /* -- Grille du calendrier -- */
  .weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:.4rem; margin-bottom:.4rem; }
  .weekday-row span{ text-align:center; font-size:.78rem; color:var(--ink-muted); letter-spacing:.04em; }

  .day-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:.4rem; }
  .day-cell{
    position:relative;
    aspect-ratio:1/1;
    border:1px solid var(--border-relic);
    border-radius:3px;
    background:var(--bg-panel);
    padding:.3rem;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:background .2s, border-color .2s;
  }
  .day-cell.empty{ border-color:transparent; background:transparent; }
  .day-num{ font-size:.85rem; color:var(--ink-muted); }
  .day-check{
    align-self:flex-end;
    width:19px; height:19px;
    border-radius:3px;
    border:1.5px solid var(--border-relic);
    background:transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:border-color .2s, box-shadow .2s;
  }
  .day-check svg{ width:13px; height:13px; opacity:0; transform:scale(.6); color:var(--red-vif); transition:opacity .15s, transform .15s; }
  .day-check:focus-visible{ outline:2px solid var(--accent-gold); outline-offset:2px; }
  .day-cell.checked{ border-color:var(--red-vif); background:linear-gradient(160deg, rgba(255,32,32,.1), var(--bg-panel)); }
  .day-cell.checked .day-check{ border-color:var(--red-vif); box-shadow:0 0 6px var(--red-glow); }
  .day-cell.checked .day-check svg{ opacity:1; transform:scale(1); }

  .day-cell:not(.empty){ cursor:pointer; }
  .day-cell:not(.empty):focus-visible{ outline:2px solid var(--accent-gold); outline-offset:2px; }
  .day-cell.selected{
    border-color:var(--green-fluo);
    box-shadow:0 0 0 2px var(--green-fluo), 0 0 10px var(--green-fluo-glow);
    animation:watch-pulse 2.4s ease-in-out infinite;
  }
  @keyframes watch-pulse{
    0%,100%{ box-shadow:0 0 0 2px var(--green-fluo), 0 0 6px rgba(57,255,20,.35); }
    50%{ box-shadow:0 0 0 2px var(--green-fluo), 0 0 18px rgba(57,255,20,.85); }
  }
  @media (prefers-reduced-motion:reduce){
    .day-cell.selected{ animation:none; box-shadow:0 0 0 2px var(--green-fluo), 0 0 10px var(--green-fluo-glow); }
  }

  @media (max-width:520px){
    .day-num{ font-size:.7rem; }
    .day-cell{ padding:.2rem; }
    .day-check{ width:16px; height:16px; }
  }

<body>

<header class="masthead">
  <h1>Cthulhu 1926 <span>— 365 Aventures</span></h1>
  <p class="masthead-sub">Un almanach mensuel — un rituel par jour.</p>
</header>

<div class="hero-banner" role="img" aria-label="Illustration Cthulhu 1926 — 365 Aventures"></div>

<div class="player-bar" id="playerBar">
  <label>Joueur
    <select id="playerSelect" aria-label="Choisir un joueur"></select>
  </label>
  <button type="button" class="mini-btn" id="newPlayerBtn" title="Créer un nouveau joueur">+ Joueur</button>
  <button type="button" class="mini-btn" id="saveBtn" title="Enregistrer la progression">Enregistrer</button>
  <button type="button" class="mini-btn mini-btn--danger" id="resetBtn" title="Réinitialiser la progression de ce joueur">Réinitialiser</button>
  <span class="save-status" id="saveStatus" aria-live="polite"></span>
</div>

<div class="selected-date-bar empty" id="selectedDateBar">Touche une case du calendrier pour choisir une date</div>
<nav class="month-nav" id="monthNav"></nav>
<main id="monthPanels"><p class="loading-note">Chargement de l'almanach…</p></main>

<script>
(function(){
  "use strict";

  const YEAR = 2026;
  const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const WEEKDAYS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  const STORAGE_PREFIX = "cal2026:";
  const PROFILES_KEY = "cal2026:profiles";
  const ACTIVE_PROFILE_KEY = "cal2026:activeProfile";
  let profiles = [];
  let activeProfileId = null;

  function monthKey(m){ return STORAGE_PREFIX + activeProfileId + ":month:" + m; }
  function selectionKeyFor(){ return STORAGE_PREFIX + activeProfileId + ":selected"; }
  function genProfileId(){ return "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  const CTHULHU_SVG = `<svg class="cthulhu-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 32 Q9 15 20 3 Q29 18 35 27 Z"/>
    <path d="M78 32 Q91 15 80 3 Q71 18 65 27 Z"/>
    <circle cx="50" cy="40" r="18"/>
    <circle cx="42" cy="37" r="2.8" fill="currentColor" stroke="none"/>
    <circle cx="58" cy="37" r="2.8" fill="currentColor" stroke="none"/>
    <path d="M31 54 Q20 65 25 81"/>
    <path d="M39 59 Q31 75 36 93"/>
    <path d="M46 62 Q42 79 46 96"/>
    <path d="M54 62 Q58 79 54 96"/>
    <path d="M61 59 Q69 75 64 93"/>
    <path d="M69 54 Q80 65 75 81"/>
  </svg>`;

  const STAR_SVG = `<svg class="star-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1">
    <circle cx="12" cy="12" r="10.6"/>
    <path d="M12 2 L17.88 20.09 L2.49 8.91 L21.51 8.91 L6.12 20.09 Z" stroke-linejoin="round"/>
  </svg>`;

  const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12.5l5.5 5.5L20 6"/>
  </svg>`;

  const state = {};
  for(let m=0; m<12; m++){
    state[m] = { bubbles:Array(8).fill(false), score:"", days:{} };
  }

  let selectedDate = null; // { m, d }
  let selectedCellEl = null;

  async function loadSelection(){
    if(!window.storage) return;
    try{
      const res = await window.storage.get(selectionKeyFor());
      if(res){
        const parsed = JSON.parse(res.value);
        if(Number.isInteger(parsed.m) && Number.isInteger(parsed.d)) selectedDate = parsed;
      }
    }catch(e){ /* pas encore de sélection enregistrée */ }
  }

  function saveSelection(){
    if(!window.storage || !selectedDate) return;
    window.storage.set(selectionKeyFor(), JSON.stringify(selectedDate), false)
      .catch(e => console.warn("Sauvegarde de la sélection impossible", e));
  }

  function updateDateBar(){
    const bar = document.getElementById("selectedDateBar");
    if(!selectedDate){
      bar.textContent = "Touche une case du calendrier pour choisir une date";
      bar.classList.add("empty");
      return;
    }
    const dateObj = new Date(YEAR, selectedDate.m, selectedDate.d);
    const formatted = dateObj.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
    bar.textContent = formatted;
    bar.classList.remove("empty");
  }

  function selectDay(m, d, cellEl){
    if(selectedCellEl) selectedCellEl.classList.remove("selected");
    cellEl.classList.add("selected");
    selectedCellEl = cellEl;
    selectedDate = { m, d };
    updateDateBar();
    saveSelection();
  }

  async function loadState(){
    if(!window.storage) return;
    const results = await Promise.allSettled(
      MONTHS.map((_, m) => window.storage.get(monthKey(m)))
    );
    results.forEach((res, m) => {
      if(res.status === "fulfilled" && res.value){
        try{
          const parsed = JSON.parse(res.value.value);
          state[m] = {
            bubbles: Array.isArray(parsed.bubbles) && parsed.bubbles.length === 8 ? parsed.bubbles : Array(8).fill(false),
            score: parsed.score || "",
            days: parsed.days || {}
          };
        }catch(e){ console.warn("Lecture impossible pour le mois", m, e); }
      }
    });
  }

  function saveState(m){
    if(!window.storage) return;
    window.storage.set(monthKey(m), JSON.stringify(state[m]), false)
      .catch(e => console.warn("Sauvegarde impossible pour le mois", m, e));
  }

  async function loadProfiles(){
    profiles = [];
    activeProfileId = null;
    if(window.storage){
      try{
        const res = await window.storage.get(PROFILES_KEY);
        if(res) profiles = JSON.parse(res.value) || [];
      }catch(e){ /* aucune liste de joueurs pour l'instant */ }
      try{
        const res2 = await window.storage.get(ACTIVE_PROFILE_KEY);
        if(res2) activeProfileId = res2.value;
      }catch(e){ /* aucun joueur actif enregistré */ }
    }
    if(!profiles.length){
      const id = genProfileId();
      profiles = [{ id, name:"Joueur 1" }];
      activeProfileId = id;
      await persistProfiles();
      await persistActiveProfile();
    }
    if(!activeProfileId || !profiles.some(p => p.id === activeProfileId)){
      activeProfileId = profiles[0].id;
      await persistActiveProfile();
    }
  }

  function persistProfiles(){
    if(!window.storage) return Promise.resolve();
    return window.storage.set(PROFILES_KEY, JSON.stringify(profiles), false)
      .catch(e => console.warn("Sauvegarde de la liste des joueurs impossible", e));
  }

  function persistActiveProfile(){
    if(!window.storage) return Promise.resolve();
    return window.storage.set(ACTIVE_PROFILE_KEY, activeProfileId, false)
      .catch(e => console.warn("Sauvegarde du joueur actif impossible", e));
  }

  function resetLocalState(){
    for(let m=0; m<12; m++){
      state[m] = { bubbles:Array(8).fill(false), score:"", days:{} };
    }
    selectedDate = null;
    selectedCellEl = null;
  }

  function currentActiveMonth(){
    const activeBtn = document.querySelector(".tab-btn.active");
    return activeBtn ? +activeBtn.dataset.month : 0;
  }

  async function switchProfile(id){
    activeProfileId = id;
    await persistActiveProfile();
    resetLocalState();
    try{ await Promise.all([loadState(), loadSelection()]); }
    catch(e){ console.warn("Chargement du joueur impossible", e); }
    const keepMonth = currentActiveMonth();
    buildPanels();
    showMonth(keepMonth);
    updateDateBar();
  }

  function buildPlayerBar(){
    const select = document.getElementById("playerSelect");
    select.innerHTML = "";
    profiles.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.name;
      if(p.id === activeProfileId) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function flashSaveStatus(){
    const status = document.getElementById("saveStatus");
    status.textContent = "Sauvegardé ✓";
    clearTimeout(flashSaveStatus._t);
    flashSaveStatus._t = setTimeout(() => { status.textContent = ""; }, 2000);
  }

  function saveAllNow(){
    for(let m=0; m<12; m++) saveState(m);
    saveSelection();
    flashSaveStatus();
  }

  async function resetProgress(){
    const ok = window.confirm("Réinitialiser toute la progression de ce joueur ? Cette action est irréversible.");
    if(!ok) return;
    resetLocalState();
    if(window.storage){
      for(let m=0; m<12; m++){
        try{ await window.storage.delete(monthKey(m), false); }catch(e){ /* déjà vide */ }
      }
      try{ await window.storage.delete(selectionKeyFor(), false); }catch(e){ /* déjà vide */ }
    }
    const keepMonth = currentActiveMonth();
    buildPanels();
    showMonth(keepMonth);
    updateDateBar();
  }

  function buildNav(){
    const nav = document.getElementById("monthNav");
    MONTHS.forEach((name, m) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn" + (m === 0 ? " active" : "");
      btn.textContent = name.slice(0,3);
      btn.setAttribute("aria-label", name + " " + YEAR);
      btn.dataset.month = m;
      btn.addEventListener("click", () => showMonth(m));
      nav.appendChild(btn);
    });
  }

  function showMonth(m){
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", +b.dataset.month === m));
    document.querySelectorAll(".month-panel").forEach(p => p.classList.toggle("active", +p.dataset.month === m));
  }

  function computeScore(m){
    const daysInMonth = new Date(YEAR, m+1, 0).getDate();
    let sundaysChecked = 0;
    for(let d=1; d<=daysInMonth; d++){
      const dow = (new Date(YEAR, m, d).getDay() + 6) % 7; // 0 = lundi ... 6 = dimanche
      if(dow === 6 && state[m].days[d]) sundaysChecked++;
    }
    let score = 5 * sundaysChecked;
    if(state[m].bubbles.every(Boolean)) score -= 5;
    return score;
  }

  function refreshScore(m){
    const score = computeScore(m);
    state[m].score = String(score);
    const input = document.querySelector('.month-panel[data-month="' + m + '"] .score-input');
    if(input) input.value = score;
    saveState(m);
  }

  function buildCthulhuCorner(m){
    const wrap = document.createElement("div");
    wrap.className = "cthulhu-corner";

    const iconWrap = document.createElement("div");
    iconWrap.className = "cthulhu-icon-wrap";
    iconWrap.innerHTML = CTHULHU_SVG;
    wrap.appendChild(iconWrap);
    const iconEl = iconWrap.querySelector(".cthulhu-icon");

    for(let i=0; i<8; i++){
      const angle = i * 45 * Math.PI / 180;
      const x = 50 + 40 * Math.sin(angle);
      const y = 50 - 40 * Math.cos(angle);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "bubble" + (state[m].bubbles[i] ? " lit" : "");
      b.style.left = x + "%";
      b.style.top = y + "%";
      b.setAttribute("aria-label", "Bulle rituelle " + (i+1) + " — " + MONTHS[m]);
      b.addEventListener("click", () => {
        state[m].bubbles[i] = !state[m].bubbles[i];
        b.classList.toggle("lit", state[m].bubbles[i]);
        iconEl.classList.toggle("awakened", state[m].bubbles.every(Boolean));
        refreshScore(m);
      });
      wrap.appendChild(b);
    }

    iconEl.classList.toggle("awakened", state[m].bubbles.every(Boolean));
    return wrap;
  }

  function buildStarCorner(m){
    const wrap = document.createElement("div");
    wrap.className = "star-corner";
    wrap.innerHTML = STAR_SVG;

    const field = document.createElement("label");
    field.className = "score-field";
    field.innerHTML = "<span>Score</span>";

    const input = document.createElement("input");
    input.type = "number";
    input.className = "score-input";
    input.readOnly = true;
    input.tabIndex = -1;
    input.value = computeScore(m);
    input.setAttribute("aria-label", "Score du mois de " + MONTHS[m] + " (calculé automatiquement)");
    field.appendChild(input);
    wrap.appendChild(field);
    return wrap;
  }

  function buildDayGrid(m){
    const grid = document.createElement("div");
    grid.className = "day-grid";

    const firstDow = (new Date(YEAR, m, 1).getDay() + 6) % 7; // 0 = lundi
    const daysInMonth = new Date(YEAR, m+1, 0).getDate();

    for(let i=0; i<firstDow; i++){
      const empty = document.createElement("div");
      empty.className = "day-cell empty";
      grid.appendChild(empty);
    }

    for(let d=1; d<=daysInMonth; d++){
      const isChecked = !!state[m].days[d];
      const isSelected = !!(selectedDate && selectedDate.m === m && selectedDate.d === d);
      const cell = document.createElement("div");
      cell.className = "day-cell" + (isChecked ? " checked" : "") + (isSelected ? " selected" : "");
      cell.tabIndex = 0;
      cell.setAttribute("role", "button");
      cell.setAttribute("aria-label", "Choisir le " + d + " " + MONTHS[m] + " comme jour en cours");
      if(isSelected) selectedCellEl = cell;

      const num = document.createElement("span");
      num.className = "day-num";
      num.textContent = d;

      const check = document.createElement("button");
      check.type = "button";
      check.className = "day-check";
      check.setAttribute("aria-label", "Cocher le " + d + " " + MONTHS[m]);
      check.innerHTML = CHECK_SVG;
      check.addEventListener("click", (e) => {
        e.stopPropagation();
        state[m].days[d] = !state[m].days[d];
        cell.classList.toggle("checked", !!state[m].days[d]);
        refreshScore(m);
      });

      cell.addEventListener("click", () => selectDay(m, d, cell));
      cell.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          selectDay(m, d, cell);
        }
      });

      cell.appendChild(num);
      cell.appendChild(check);
      grid.appendChild(cell);
    }
    return grid;
  }

  function buildPanels(){
    const main = document.getElementById("monthPanels");
    main.innerHTML = "";

    MONTHS.forEach((name, m) => {
      const panel = document.createElement("section");
      panel.className = "month-panel" + (m === 0 ? " active" : "");
      panel.dataset.month = m;

      const header = document.createElement("div");
      header.className = "month-header";
      header.appendChild(buildCthulhuCorner(m));

      const title = document.createElement("h2");
      title.className = "month-title";
      title.innerHTML = name + '<span class="year">' + YEAR + '</span>';
      header.appendChild(title);

      header.appendChild(buildStarCorner(m));
      panel.appendChild(header);

      const wdRow = document.createElement("div");
      wdRow.className = "weekday-row";
      WEEKDAYS.forEach(d => {
        const s = document.createElement("span");
        s.textContent = d;
        wdRow.appendChild(s);
      });
      panel.appendChild(wdRow);

      panel.appendChild(buildDayGrid(m));

      main.appendChild(panel);
    });
  }

  (async function init(){
    await loadProfiles();
    try{ await Promise.all([loadState(), loadSelection()]); }
    catch(e){ console.warn("Chargement de l'état impossible, démarrage à vide.", e); }
    buildNav();
    buildPlayerBar();
    buildPanels();
    updateDateBar();

    document.getElementById("playerSelect").addEventListener("change", (e) => switchProfile(e.target.value));
    document.getElementById("newPlayerBtn").addEventListener("click", async () => {
      const name = window.prompt("Nom du nouveau joueur :");
      if(!name || !name.trim()) return;
      const id = genProfileId();
      profiles.push({ id, name: name.trim() });
      await persistProfiles();
      buildPlayerBar();
      document.getElementById("playerSelect").value = id;
      await switchProfile(id);
    });
    document.getElementById("saveBtn").addEventListener("click", saveAllNow);
    document.getElementById("resetBtn").addEventListener("click", resetProgress);
  })();
})();
</script>
</body>
</html>
